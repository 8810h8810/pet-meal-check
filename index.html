<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>週間ごはんチェック</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7efe2}.app{position:relative;height:100dvh;max-width:520px;margin:auto;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}.sheet{position:relative;width:100%;height:min(calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)),150vw);max-height:100dvh;background:url("IMG_9853.jpeg") center top/100% 100% no-repeat}.tap{position:absolute;width:41%;height:7.1%;border:0;background:transparent;cursor:pointer}.tap.on:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 34px/1 sans-serif;color:#29251f;text-shadow:0 1px #fff}.m{left:18%;}.n{left:59%}.r0{top:33.7%}.r1{top:40.6%}.r2{top:47.5%}.r3{top:54.4%}.r4{top:61.3%}.r5{top:68.2%}.r6{top:75.1%}.reset{position:absolute;left:29%;right:29%;bottom:0.8%;height:13.8%;border:0;background:transparent;color:transparent;padding:0}</style></head><body><main class="app"><div class="sheet" id="sheet"></div><button class="reset" id="reset" aria-label="今週をリセット">リセット</button></main><script>
const key="pet-meal-check-dog-v1",sheet=document.getElementById("sheet");let state=JSON.parse(localStorage.getItem(key)||"{}");for(let i=0;i<7;i++){for(let j=0;j<2;j++){const id=i+"-"+j,b=document.createElement("button");b.className="tap "+(j?"n ":"m ")+"r"+i+(state[id]?" on":"");b.setAttribute("aria-label",(i+1)+"行目"+(j?"夜":"朝"));b.onclick=()=>{state[id]=!state[id];b.classList.toggle("on",state[id]);localStorage.setItem(key,JSON.stringify(state))};sheet.appendChild(b)}}document.getElementById("reset").onclick=()=>{if(confirm("今週のチェックを全部消しますか？")){state={};localStorage.removeItem(key);document.querySelectorAll(".tap").forEach(b=>b.classList.remove("on"))}};
</script></body></html>
