<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>犬の週間ごはんチェック</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f7f0df;color:#292722;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
body{min-height:100dvh}.app{height:100dvh;max-width:520px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto 1fr auto;gap:8px}
header{position:relative;min-height:92px;padding:8px 118px 0 6px}.kicker{font-size:12px;letter-spacing:.08em}.title{font-weight:900;font-size:clamp(22px,7vw,34px);line-height:1.1;margin:3px 0;transform:rotate(-1deg)}.dog{position:absolute;right:0;top:-4px;width:116px;height:104px}.dog svg{width:100%;height:100%}
.note{font-size:12px;margin:0 4px 2px;color:#625d52}.grid{min-height:0;display:grid;grid-template-columns:.72fr 1fr 1fr;grid-template-rows:auto repeat(7,1fr);border:2px solid #38342e;border-radius:12px;overflow:hidden;box-shadow:2px 3px 0 #c8bca4;background:#fffaf0}
.cell{display:flex;align-items:center;justify-content:center;border-right:1.5px solid #665f54;border-bottom:1.5px solid #665f54;font-weight:700;min-height:0}.cell:nth-child(3n){border-right:0}.cell:nth-last-child(-n+3){border-bottom:0}.head{background:#eee5d2;font-size:13px}.head:nth-child(2)::before{content:"☀️ ";font-size:14px}.head:nth-child(3)::before{content:"🌙 ";font-size:14px}.day{font-size:15px}.mon{background:#f4d8d0}.tue{background:#f2e1b8}.wed{background:#d7e7d0}.thu{background:#cfe3e7}.fri{background:#d8d9ec}.sat{background:#e1d4e9}.sun{background:#ecd5d7}
.check{border:0;background:transparent;width:100%;height:100%;font-size:22px;cursor:pointer;color:#2d2a26;position:relative}.check:before{content:"🐾";opacity:.18;filter:grayscale(1);font-size:20px}.check.on:before{content:"✓";opacity:1;font-weight:900;font-size:25px}
footer{display:flex;align-items:center;justify-content:space-between;gap:8px}.tiny{font-size:11px;color:#716a5d}.reset{border:1.5px solid #504a41;border-radius:999px;background:#f4e9d3;padding:8px 14px;font-weight:700;color:#302d28}
</style></head>
<body><main class="app">
<header><div class="kicker">犬の週間ごはんチェック</div><div class="title">空腹のふりには<br>もう騙されないぞ!!</div>
<div class="dog"><svg viewBox="0 0 120 105" aria-label="犬の落書き"><g fill="none" stroke="#222" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M30 36 24 12l22 15c10-5 22-5 32 0l22-15-6 25c8 8 10 20 7 32-3 13-13 23-26 27l-8 2-7-3-7 3-9-3C31 91 22 80 20 67c-2-12 1-23 10-31Z"/><path d="M35 39q8-7 16-7M85 39q-8-7-16-7"/><path d="M40 51q5-2 9 0M72 51q5-2 9 0"/><path fill="#222" d="M55 60q5-5 10 0-1 6-5 6t-5-6Z"/><path d="M60 66v5m0 0q-7 7-13 0m13 0q7 7 13 0"/><path d="M46 82q14 6 28 0"/><path d="M99 73q15-8 16 7-2 13-17 16"/></g></svg></div></header>
<p class="note">食べたら肉球をタップ。もう一度タップすると戻せます。</p>
<section class="grid" id="grid"><div class="cell head">曜日</div><div class="cell head">朝</div><div class="cell head">夜</div></section>
<footer><span class="tiny">この端末に自動保存されます</span><button class="reset" id="reset">今週をリセット</button></footer>
</main>
<script>
const days=[["月","mon"],["火","tue"],["水","wed"],["木","thu"],["金","fri"],["土","sat"],["日","sun"]],key="pet-meal-check-dog-v1";
let state=JSON.parse(localStorage.getItem(key)||"{}");const grid=document.getElementById("grid");
days.forEach(([d,c],i)=>{grid.insertAdjacentHTML("beforeend",'<div class="cell day '+c+'">'+d+'</div>');["朝","夜"].forEach((_,j)=>{const id=i+"-"+j,b=document.createElement("button");b.className="cell check"+(state[id]?" on":"");b.setAttribute("aria-label",d+"曜日"+(j?"夜":"朝"));b.onclick=()=>{state[id]=!state[id];b.classList.toggle("on",state[id]);localStorage.setItem(key,JSON.stringify(state))};grid.appendChild(b)})});
document.getElementById("reset").onclick=()=>{if(confirm("今週のチェックを全部消しますか？")){state={};localStorage.removeItem(key);document.querySelectorAll(".check").forEach(b=>b.classList.remove("on"))}};
</script></body></html>
