<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ごはんあげた?</title><meta name="apple-mobile-web-app-title" content="ごはんあげた?"><link rel="apple-touch-icon" href="dog-icon.jpeg%20.jpg"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7efe2}.app{position:relative;height:100dvh;max-width:520px;margin:auto;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}.sheet{position:relative;width:100%;aspect-ratio:3/4.5;background:url("IMG_9853.jpeg") center top/100% 100% no-repeat}.tap{position:absolute;width:41%;height:7.1%;border:0;background:transparent;cursor:pointer}.tap.on:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 34px/1 sans-serif;color:#29251f;text-shadow:0 1px #fff}.m{left:18%;}.n{left:59%}.r0{top:33.8%}.r1{top:40.7%}.r2{top:47.6%}.r3{top:54.5%}.r4{top:61.4%}.r5{top:68.3%}.r6{top:75.2%}.reset{position:absolute;left:29%;top:84%;width:42%;height:12%;border:0;background:transparent;color:transparent;padding:0;z-index:5}</style></head><body><main class="app"><div class="sheet" id="sheet"><button class="reset" id="reset" aria-label="リセット">リセット</button></div></main><script>
const key="pet-meal-check-dog-v1",sheet=document.getElementById("sheet");let state=JSON.parse(localStorage.getItem(key)||"{}");for(let i=0;i<7;i++){for(let j=0;j<2;j++){const id=i+"-"+j,b=document.createElement("button");b.className="tap "+(j?"n ":"m ")+"r"+i+(state[id]?" on":"");b.setAttribute("aria-label",(i+1)+"行目"+(j?"夜":"朝"));b.onclick=()=>{state[id]=!state[id];b.classList.toggle("on",state[id]);localStorage.setItem(key,JSON.stringify(state))};sheet.appendChild(b)}}document.getElementById("reset").onclick=()=>{if(confirm("今週のチェックを全部消しますか？")){state={};localStorage.removeItem(key);document.querySelectorAll(".tap").forEach(b=>b.classList.remove("on"))}};
</script></body></html>
