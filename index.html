<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>週間ごはんチェック</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f6efdf;color:#211f1b;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}.app{height:100dvh;max-width:520px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 18px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:132px 1fr 36px;gap:7px}
.hero{position:relative}.mark{position:absolute;left:2px;top:2px;width:62%;height:20px;background:#f4dca8;border-radius:50%;transform:rotate(-3deg);top:52px}.title{position:absolute;z-index:2;left:5px;top:14px;font-size:clamp(25px,7.1vw,34px);line-height:1.06;font-weight:900;letter-spacing:.01em;transform:rotate(-1.5deg)}.sketch{position:absolute;right:0;top:7px;width:108px;height:112px}.sketch svg{width:100%;height:100%}.mini{position:absolute;font-size:18px;filter:grayscale(1);opacity:.8}.bone{right:90px;top:4px;transform:rotate(-12deg)}.bowl{right:101px;bottom:2px}
.board{min-height:0;display:grid;grid-template-columns:.68fr 1fr 1fr;grid-template-rows:42px repeat(7,1fr);border:3px solid #29251f;border-radius:15px 11px 14px 10px;overflow:hidden;background:#fffaf1;box-shadow:3px 4px 0 #d4c5a8;transform:rotate(.06deg)}.cell{min-height:0;display:flex;align-items:center;justify-content:center;border-right:2px solid #39342d;border-bottom:2px solid #39342d;font-weight:800}.cell:nth-child(3n){border-right:0}.cell:nth-last-child(-n+3){border-bottom:0}.head{background:#fff8e9;font-size:15px}.morning{background:#f7e5bf}.evening{background:#dce8ef}.day{font-size:18px}.mon{background:#f2ced1}.tue{background:#f3dda9}.wed{background:#e9e4ad}.thu{background:#cfe4bf}.fri{background:#cbe2d0}.sat{background:#cfe0ee}.sun{background:#e8cee4}.check{border:0;background:#fffaf1;cursor:pointer}.check:before{content:"🐾";font-size:23px;opacity:.19;filter:grayscale(1)}.check.on:before{content:"✓";opacity:1;font-size:28px;font-weight:900}.foot{display:flex;justify-content:flex-end;align-items:center}.reset{border:0;background:none;color:#766d5e;font-size:11px;text-decoration:underline;padding:8px}
</style></head><body><main class="app"><header class="hero"><div class="mark"></div><div class="title">空腹のふりには<br>もう騙されないぞ!!</div><span class="mini bone">🦴</span><span class="mini bowl">🥣</span><div class="sketch"><svg viewBox="0 0 120 120" aria-label="犬"><g fill="none" stroke="#24211d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M31 41 24 16l23 15q14-7 28 0l23-15-7 26q9 11 6 29c-3 18-17 31-37 31S27 90 24 72q-3-18 7-31Z"/><path d="M38 51q6-3 11 0m22 0q6-3 11 0"/><path d="M55 61q5-5 10 0-1 6-5 6t-5-6Z"/><path d="M60 67v5m0 0q-7 7-14 0m14 0q7 7 14 0"/><path d="M43 84q17 7 34 0"/><path d="M94 74q17-8 18 7-2 16-18 17"/></g></svg></div></header><section class="board" id="board"><div class="cell head">曜日</div><div class="cell head morning">☀ 朝</div><div class="cell head evening">☾ 夜</div></section><footer class="foot"><button class="reset" id="reset">今週をリセット</button></footer></main><script>
const days=[["月","mon"],["火","tue"],["水","wed"],["木","thu"],["金","fri"],["土","sat"],["日","sun"]],key="pet-meal-check-dog-v1",board=document.getElementById("board");let state=JSON.parse(localStorage.getItem(key)||"{}");days.forEach(([d,cl],i)=>{board.insertAdjacentHTML("beforeend",'<div class="cell day '+cl+'">'+d+'</div>');["朝","夜"].forEach((x,j)=>{let id=i+"-"+j,b=document.createElement("button");b.className="cell check"+(state[id]?" on":"");b.setAttribute("aria-label",d+"曜日"+x);b.onclick=()=>{state[id]=!state[id];b.classList.toggle("on",state[id]);localStorage.setItem(key,JSON.stringify(state))};board.appendChild(b)})});document.getElementById("reset").onclick=()=>{if(confirm("今週のチェックを全部消しますか？")){state={};localStorage.removeItem(key);document.querySelectorAll(".check").forEach(b=>b.classList.remove("on"))}};
</script></body></html>
