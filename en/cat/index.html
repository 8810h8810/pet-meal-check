<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Did you feed the cat?</title><meta name="apple-mobile-web-app-title" content="Fed yet?">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7efe2;color:#29251f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;min-height:100dvh;padding:22px 16px 30px}.card{background:#fffaf1;border:2px solid #29251f;border-radius:22px;padding:20px;box-shadow:4px 4px 0 #29251f}
.hero{text-align:center}.pet{font-size:58px;line-height:1}.hero h1{margin:8px 0 2px;font-size:28px}.hero p{margin:0 0 18px;font-weight:700}
table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1.5px solid #29251f;text-align:center;height:52px}th{font-size:13px;background:#f2e4cc}th:first-child{width:24%}
.tap{width:36px;height:36px;border:2px solid #29251f;border-radius:50%;background:#fff;cursor:pointer;font-size:23px;font-weight:900;color:#29251f}.tap.on{background:#f2e4cc}
.note{font-size:12px;text-align:center;margin:14px 0 0}.reset{display:block;margin:18px auto 0;border:1.5px solid #29251f;border-radius:999px;background:transparent;padding:9px 18px;font-weight:700;cursor:pointer}
</style></head><body><main class="app"><section class="card"><div class="hero"><div class="pet">🐱</div><h1>Did you feed the cat?</h1><p>Nice try. You've already been fed!</p></div>
<table><thead><tr><th>DAY</th><th>AM</th><th>PM</th></tr></thead><tbody id="rows"></tbody></table>
<p class="note">Tap a circle after feeding. Saved on this device.</p><button class="reset" id="reset">Reset this week</button></section></main>
<script>
const days=["MON","TUE","WED","THU","FRI","SAT","SUN"],key="pet-meal-check-cat-en-v1",rows=document.getElementById("rows");let state=JSON.parse(localStorage.getItem(key)||"{}");
days.forEach((day,i)=>{const tr=document.createElement("tr");tr.innerHTML="<th>"+day+"</th>";for(let j=0;j<2;j++){const td=document.createElement("td"),b=document.createElement("button"),id=i+"-"+j;b.className="tap"+(state[id]?" on":"");b.textContent=state[id]?"✓":"";b.setAttribute("aria-label",day+" "+(j?"PM":"AM"));b.onclick=()=>{state[id]=!state[id];b.classList.toggle("on",state[id]);b.textContent=state[id]?"✓":"";localStorage.setItem(key,JSON.stringify(state))};td.appendChild(b);tr.appendChild(td)}rows.appendChild(tr)});
document.getElementById("reset").onclick=()=>{if(confirm("Clear all checks for this week?")){state={};localStorage.removeItem(key);document.querySelectorAll(".tap").forEach(b=>{b.classList.remove("on");b.textContent=""})}};
</script></body></html>
